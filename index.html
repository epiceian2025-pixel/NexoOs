<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXOS OS</title>
<style>
:root{--accent:#8b5cf6;--accent2:#22d3ee;--ink:#eef2ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
body{background:#080d1b}
.desktop{height:100%;position:relative;isolation:isolate;background:
radial-gradient(ellipse at 70% 24%,#6339b866 0,transparent 34%),
radial-gradient(ellipse at 30% 82%,#087f9b55 0,transparent 38%),
linear-gradient(135deg,#090e20 0%,#111a36 48%,#070b18 100%)}
.desktop:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:linear-gradient(#8eb7ff18 1px,transparent 1px),linear-gradient(90deg,#8eb7ff18 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(transparent,#000 30%,#000)}
.desktop:after{content:"";position:absolute;width:55vw;height:55vw;max-width:700px;max-height:700px;right:8%;top:8%;z-index:-1;border-radius:50%;border:1px solid #9bdcff24;box-shadow:0 0 0 35px #9bdcff08,0 0 0 85px #9bdcff06,0 0 100px #6b5bff22;transform:rotate(-20deg)}
.topbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#070b16a8;border-bottom:1px solid #ffffff15;backdrop-filter:blur(18px);font-size:12px;letter-spacing:.04em}
.brand{font-weight:900;letter-spacing:.2em}.brand span{color:var(--accent2)}.topright{display:flex;gap:18px;color:#c3cce5}
.workspace{height:calc(100% - 112px);padding:28px 28px 22px 106px;position:relative}
.desktop-label{position:absolute;right:30px;top:26px;text-align:right;color:#c9d5f2}.desktop-label strong{display:block;font-size:24px;letter-spacing:.12em}.desktop-label small{color:#91a1c5;letter-spacing:.18em}
.icons{display:grid;grid-template-columns:repeat(1,82px);gap:16px;width:88px}
.desktop-icon{border:1px solid transparent;background:transparent;color:#f3f6ff;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 3px;border-radius:13px;cursor:pointer;font:inherit}
.desktop-icon:hover,.desktop-icon:focus{background:#ffffff16;border-color:#ffffff25;outline:none}
.appglyph{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#ffffff26,#ffffff08);border:1px solid #ffffff30;box-shadow:inset 0 1px #ffffff25,0 8px 25px #0004}
.desktop-icon small{font-size:11px;text-shadow:0 2px 5px #000}
.dock-wrap{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:20px;background:#080d1dc9;border:1px solid #ffffff24;box-shadow:0 12px 35px #0007;backdrop-filter:blur(24px)}
.dockbtn{width:44px;height:44px;border:1px solid #ffffff18;border-radius:13px;background:#ffffff0c;color:white;font-size:21px;cursor:pointer;transition:.16s}.dockbtn:hover{transform:translateY(-6px);background:#ffffff24;border-color:var(--accent2)}
.docksep{height:30px;width:1px;background:#ffffff25;margin:0 3px}
.window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 150px));height:min(560px,calc(100% - 55px));border:1px solid #a5b4fc55;border-radius:17px;background:#10182bea;box-shadow:0 28px 90px #0009,0 0 45px #8b5cf622;backdrop-filter:blur(28px);display:none;overflow:hidden;z-index:5}
.window.max{width:calc(100% - 130px);height:calc(100% - 22px);top:50%;left:calc(50% + 35px)}
.winbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#ffffff09;border-bottom:1px solid #ffffff17;cursor:move;user-select:none}
.wintitle{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:750;letter-spacing:.04em}.wincontrols{display:flex;gap:7px}.wincontrols button{width:27px;height:27px;border:0;border-radius:8px;background:#ffffff13;color:#e8edff;cursor:pointer}.wincontrols button:last-child:hover{background:#e34e65}
.wincontent{height:calc(100% - 48px);padding:22px;overflow:auto}.eyebrow{font-size:10px;letter-spacing:.22em;color:#91a7d4;font-weight:800}.heading{font-size:28px;font-weight:850;letter-spacing:-.04em;margin:5px 0 8px}.sub{font-size:13px;line-height:1.6;color:#aebbd9;max-width:650px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}.tile{border:1px solid #ffffff17;background:linear-gradient(145deg,#ffffff0d,#ffffff04);padding:16px;border-radius:14px;min-height:112px}.tile b{display:block;margin:7px 0}.tile p{font-size:12px;color:#aebbd9;line-height:1.5;margin:0}
.btn{border:1px solid #a78bfa66;background:linear-gradient(135deg,#8b5cf655,#22d3ee22);color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700;margin:7px 6px 0 0}.btn:hover{filter:brightness(1.2)}
input,select{background:#0a1124;border:1px solid #ffffff28;color:#fff;border-radius:9px;padding:10px}
.palette{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.swatch{width:34px;height:34px;border:2px solid #ffffffb0;border-radius:50%;cursor:pointer}
.searchbar{display:flex;gap:8px;flex-wrap:wrap}.searchbar input{flex:1;min-width:180px}
.statusbar{position:absolute;bottom:0;left:0;right:0;height:28px;background:#060a14aa;border-top:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#8393b8;font-size:10px;letter-spacing:.08em}
.startmenu{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);width:min(340px,90vw);padding:16px;border:1px solid #ffffff25;border-radius:17px;background:#10182bf2;box-shadow:0 20px 60px #0009;backdrop-filter:blur(24px);display:none;z-index:8}
.startmenu h3{margin:2px 0 12px}.startgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.startgrid button{background:#ffffff0b;border:1px solid #ffffff16;border-radius:11px;color:white;padding:12px 4px;cursor:pointer}.startgrid span{display:block;font-size:23px;margin-bottom:5px}.startgrid small{font-size:10px}
@media(max-width:600px){.workspace{padding:22px 12px 20px 84px}.icons{grid-template-columns:repeat(1,70px);gap:9px}.desktop-icon{padding:5px 0}.appglyph{width:43px;height:43px}.desktop-label{top:auto;bottom:22px;right:12px}.desktop-label strong{font-size:15px}.window{width:calc(100vw - 95px);height:72%;left:calc(50% + 34px)}.window.max{width:calc(100% - 90px);left:calc(50% + 40px)}.wincontent{padding:15px}.heading{font-size:23px}.dock-wrap{left:calc(50% + 30px);gap:4px}.dockbtn{width:38px;height:38px}.topright{gap:8px}.statusbar{font-size:9px}}
</style></head>
<body><div class="desktop">
<header class="topbar"><div class="brand">NEXOS <span>OS</span></div><div class="topright"><span>◈ NETWORK CONNECTED</span><span id="topclock">--:--</span></div></header>
<main class="workspace">
<div class="icons">
<button class="desktop-icon" onclick="openApp('games')"><span class="appglyph">🎮</span><small>Games</small></button>
<button class="desktop-icon" onclick="openApp('browser')"><span class="appglyph">🌐</span><small>Browser</small></button>
<button class="desktop-icon" onclick="openApp('movies')"><span class="appglyph">▶</span><small>Movies</small></button>
<button class="desktop-icon" onclick="openApp('settings')"><span class="appglyph">⚙</span><small>Settings</small></button>
<button class="desktop-icon" onclick="openApp('cloak')"><span class="appglyph">🎓</span><small>Classroom look</small></button>
</div>
<div class="desktop-label"><strong>YOUR SPACE.</strong><small>WELCOME TO NEXOS</small></div>
<section class="window" id="win"><div class="winbar" id="drag"><div class="wintitle"><span id="winicon">◈</span><span id="wintitle">APPLICATION</span></div><div class="wincontrols"><button title="Minimize" onclick="minimize()">—</button><button title="Maximize" onclick="maximize()">□</button><button title="Close" onclick="closeApp()">×</button></div></div><div class="wincontent" id="content"></div></section>
<section class="startmenu" id="start"><h3>NEXOS launcher</h3><div class="startgrid"><button onclick="openApp('games');toggleStart()"><span>🎮</span><small>Games</small></button><button onclick="openApp('browser');toggleStart()"><span>🌐</span><small>Browser</small></button><button onclick="openApp('movies');toggleStart()"><span>▶</span><small>Movies</small></button><button onclick="openApp('settings');toggleStart()"><span>⚙</span><small>Settings</small></button><button onclick="openApp('cloak');toggleStart()"><span>🎓</span><small>Classroom</small></button></div></section>
</main>
<nav class="dock-wrap"><button class="dockbtn" title="Launcher" onclick="toggleStart()">▦</button><div class="docksep"></div><button class="dockbtn" title="Games" onclick="openApp('games')">🎮</button><button class="dockbtn" title="Browser" onclick="openApp('browser')">🌐</button><button class="dockbtn" title="Movies" onclick="openApp('movies')">▶</button><button class="dockbtn" title="Settings" onclick="openApp('settings')">⚙</button></nav>
<footer class="statusbar"><span>NEXOS DESKTOP ENVIRONMENT</span><span>SECURE SESSION · <span id="date"></span></span></footer>
</div>
<script>
const win=document.getElementById('win'),content=document.getElementById('content'),start=document.getElementById('start');
const data={
games:['🎮','GAMES LIBRARY',`<div class="eyebrow">NEXOS ENTERTAINMENT</div><div class="heading">Game library</div><p class="sub">Your game collection lives here. This starter edition is ready for your HTML games to be added next.</p><div class="tiles"><div class="tile">🎯<b>Game collection</b><p>No games installed yet. We'll add your game links here.</p></div><div class="tile">🕹️<b>Recently played</b><p>Your recently played games will appear here.</p></div></div>`],
browser:['🌐','NEXOS WEB',`<div class="eyebrow">INTERNET</div><div class="heading">Web browser</div><p class="sub">Type a website address and open it in a new tab. Some sites block embedded previews.</p><div class="searchbar"><input id="url" placeholder="https://example.com"><button class="btn" onclick="goWeb()">Open website ↗</button></div><div class="tile" style="margin-top:18px">🔎<b>Quick note</b><p>For security and compatibility, websites open in a separate browser tab.</p></div>`],
movies:['▶','MOVIE CENTER',`<div class="eyebrow">ENTERTAINMENT</div><div class="heading">Movie center</div><p class="sub">Launch official streaming services. A subscription may be required.</p><div class="tiles"><div class="tile">🍿<b>Netflix</b><p>Open Netflix's official website.</p><button class="btn" onclick="window.open('https://www.netflix.com/','_blank','noopener')">Launch Netflix ↗</button></div><div class="tile">🎬<b>More services</b><p>We can add other official streaming links later.</p></div></div>`],
settings:['⚙','SYSTEM SETTINGS',`<div class="eyebrow">PERSONALIZATION</div><div class="heading">Make it yours</div><p class="sub">Change the desktop accent glow.</p><div class="palette"><button class="swatch" style="background:#8b5cf6" onclick="theme('#8b5cf6','#22d3ee')"></button><button class="swatch" style="background:#00b894" onclick="theme('#00b894','#6ee7b7')"></button><button class="swatch" style="background:#f43f5e" onclick="theme('#f43f5e','#fbbf24')"></button><button class="swatch" style="background:#268cff" onclick="theme('#268cff','#67e8f9')"></button><button class="swatch" style="background:#f59e0b" onclick="theme('#f59e0b','#fde68a')"></button><input aria-label="Custom accent" type="color" value="#8b5cf6" onchange="theme(this.value,'#22d3ee')"></div><div class="tiles"><div class="tile">🖥️<b>Desktop</b><p>More wallpaper and layout choices can be added.</p></div><div class="tile">✨<b>Appearance</b><p>Your accent updates instantly.</p></div></div>`],
cloak:['🎓','CLASSROOM THEME',`<div class="eyebrow">APPEARANCE</div><div class="heading">Classroom-style theme</div><p class="sub">Apply a Classroom-inspired look to the NEXOS page. This is cosmetic only; it does not disguise browser activity, change browser history, or turn this site into Google Classroom.</p><div class="tile">🎓<b>Classroom appearance</b><p>Change the page title and desktop label, then restore NEXOS whenever you want.</p><button class="btn" onclick="document.title='Classroom';document.querySelector('.brand').innerHTML='CLASSROOM <span>PORTAL</span>'">Apply look</button><button class="btn" onclick="document.title='NEXOS OS';document.querySelector('.brand').innerHTML='NEXOS <span>OS</span>'">Restore NEXOS</button></div>`]
};
function openApp(k){let d=data[k];document.getElementById('winicon').textContent=d[0];document.getElementById('wintitle').textContent=d[1];content.innerHTML=d[2];win.style.display='block';win.classList.remove('max')}
function closeApp(){win.style.display='none'}function minimize(){win.style.display='none'}function maximize(){win.classList.toggle('max')}
function toggleStart(){start.style.display=start.style.display==='block'?'none':'block'}
function theme(a,b){document.documentElement.style.setProperty('--accent',a);document.documentElement.style.setProperty('--accent2',b)}
function goWeb(){let v=document.getElementById('url').value.trim();if(v){if(!/^https?:\/\//i.test(v))v='https://'+v;window.open(v,'_blank','noopener')}}
function clock(){let d=new Date();document.getElementById('topclock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString()}clock();setInterval(clock,1000);
// Drag window by its title bar
const bar=document.getElementById('drag');let moving=false,dx=0,dy=0;
bar.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;moving=true;let r=win.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;bar.setPointerCapture(e.pointerId)});
bar.addEventListener('pointermove',e=>{if(!moving||win.classList.contains('max'))return;win.style.left=(e.clientX-dx+win.offsetWidth/2)+'px';win.style.top=(e.clientY-dy+win.offsetHeight/2)+'px';win.style.transform='translate(-50%,-50%)'});
bar.addEventListener('pointerup',()=>moving=false);
</script></body></html>
